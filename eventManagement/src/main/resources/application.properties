spring.application.name=eventManagement

# Logger
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%15.15thread] %-40.40logger{39} : %msg%n

# PostGIS Configuration
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/event_management}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Prediction
eventmanagement.analysis.prediction.horizon-minutes=${EVENTMANAGEMENT_ANALYSIS_PREDICTION_HORIZON_MINUTES:2}
eventmanagement.analysis.prediction.window-minutes=${EVENTMANAGEMENT_ANALYSIS_PREDICTION_WINDOW_MINUTES:2}

### Network Latency Model Configuration
eventmanagement.latency.transport-ms=${LATENCY_TRANSPORT_MS:1.0}
eventmanagement.latency.exit-edge-ms=${LATENCY_EXIT_EDGE_MS:40.0}
eventmanagement.latency.exit-cloud-ms=${LATENCY_EXIT_CLOUD_MS:1.0}
eventmanagement.latency.cloud-ingress-ms=${LATENCY_CLOUD_INGRESS_MS:40.0}
eventmanagement.latency.base-edge-ms=${LATENCY_BASE_EDGE_MS:1.0}
eventmanagement.latency.ms-per-meter=${LATENCY_MS_PER_METER:0.04}
eventmanagement.latency.ws-local-ms=${LATENCY_WS_LOCAL_MS:1.5}
eventmanagement.latency.ws-wan-ms=${LATENCY_WS_WAN_MS:40.0}
eventmanagement.latency.ema-alpha=${LATENCY_EMA_ALPHA:0.2}
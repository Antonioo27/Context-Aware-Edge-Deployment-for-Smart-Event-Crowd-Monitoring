# ---------------------------------------------------------------------------
# Mosquitto 2.x - configurazione per lo sviluppo locale.
#
# ATTENZIONE: allow_anonymous true e' accettabile solo in locale e dentro il
# cluster di prova. Va dichiarato tra i limiti nella relazione.
# ---------------------------------------------------------------------------

# In Mosquitto 2.x il listener di default ascolta SOLO su localhost interno al
# container: senza questa riga, dall'host non si connette nessuno.
# Listener TCP Standard (per Simulator e Pod Java)
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# Listener WebSockets (per il Frontend React sul Browser)
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true


# ---------------------------------------------------------------------------
# Persistenza
# ---------------------------------------------------------------------------
# Serve a far sopravvivere le sessioni persistenti (e quindi le code dei
# messaggi QoS 1 per i subscriber offline) a un riavvio del broker stesso.
persistence true
persistence_location /mosquitto/data/

# Il default e' 1800 s: in caso di crash del broker perderesti fino a mezz'ora
# di stato di sessione. 30 s e' un compromesso ragionevole per un progetto.
autosave_interval 30

# ---------------------------------------------------------------------------
# Code e finestra di invio
# ---------------------------------------------------------------------------
# Quanti messaggi QoS>0 il broker conserva per un client con sessione
# persistente mentre e' offline. E' il parametro che determina quanto a lungo
# un servizio di analisi puo' restare giu' senza perdere probe.
#   ~2 msg/s per topic  ->  1000 messaggi ~= 8 minuti di margine.
max_queued_messages 1000

# Messaggi QoS>0 in volo verso un singolo client senza PUBACK.
max_inflight_messages 40

# I messaggi QoS 0 NON vengono accodati per i client offline (default false).
# Lasciato esplicito perche' e' il motivo per cui il servizio di analisi deve
# iscriversi con QoS 1 e non 0.
queue_qos0_messages false

# Quanto a lungo il broker conserva la sessione di un client mai piu' tornato.
# Il default e' "per sempre": in un progetto va bene, ma vale la pena saperlo.
# persistent_client_expiration 1h

# ---------------------------------------------------------------------------
# Log
# ---------------------------------------------------------------------------
log_dest stdout
log_type notice
log_type warning
log_type error
connection_messages true
log_timestamp true
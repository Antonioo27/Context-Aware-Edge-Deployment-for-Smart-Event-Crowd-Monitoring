spring.application.name=eventAnalysis

# Environment variable mappings for AnalysisProperties
analysis.area-id=${AREA_ID:default-area}
analysis.mqtt-host=${MQTT_HOST:localhost}
analysis.mqtt-port=${MQTT_PORT:1883}
analysis.mqtt-keepalive=${MQTT_KEEPALIVE:30}
analysis.mqtt-qos=${MQTT_QOS:1}
analysis.mqtt-clean-session=${MQTT_CLEAN_SESSION:false}
analysis.mqtt-topic-prefix=${MQTT_TOPIC_PREFIX:event}
analysis.mqtt-username=${MQTT_USERNAME:}
analysis.mqtt-password=${MQTT_PASSWORD:}
analysis.manual-ack=${ANALYSIS_MANUAL_ACK:true}
analysis.max-queue-size=${ANALYSIS_MAX_QUEUE_SIZE:200}
analysis.dedup-window=${ANALYSIS_DEDUP_WINDOW:500}
analysis.reconnect-min-delay=${ANALYSIS_RECONNECT_MIN_DELAY:1}
analysis.reconnect-max-delay=${ANALYSIS_RECONNECT_MAX_DELAY:30}
analysis.log-level=${ANALYSIS_LOG_LEVEL:INFO}

# Sliding Window Parameters
analysis.window-size=${ANALYSIS_WINDOW_SIZE:60.0}
analysis.slide-step=${ANALYSIS_SLIDE_STEP:5.0}
analysis.mean-exp-int=${ANALYSIS_MEAN_EXP_INT:25}
analysis.trend-max-stable-angle=${ANALYSIS_TREND_MAX_STABLE_ANGLE:1.0}
analysis.trend-highly-angle=${ANALYSIS_TREND_HIGHLY_ANGLE:2.5}


### Network Latency Model Configuration
eventmanagement.latency.transport-ms=${LATENCY_TRANSPORT_MS:1.0}
eventmanagement.latency.exit-edge-ms=${LATENCY_EXIT_EDGE_MS:40.0}
eventmanagement.latency.exit-cloud-ms=${LATENCY_EXIT_CLOUD_MS:1.0}
eventmanagement.latency.cloud-ingress-ms=${LATENCY_CLOUD_INGRESS_MS:40.0}
eventmanagement.latency.base-edge-ms=${LATENCY_BASE_EDGE_MS:1.0}
eventmanagement.latency.ms-per-meter=${LATENCY_MS_PER_METER:0.04}
eventmanagement.latency.ws-local-ms=${LATENCY_WS_LOCAL_MS:1.5}
eventmanagement.latency.ws-wan-ms=${LATENCY_WS_WAN_MS:40.0}
eventmanagement.latency.ema-alpha=${LATENCY_EMA_ALPHA:0.2}
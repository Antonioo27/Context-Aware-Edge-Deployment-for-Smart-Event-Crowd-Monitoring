# 1. Definizione del ServiceAccount per EventManagement
apiVersion: v1
kind: ServiceAccount
metadata:
  name: event-management-sa
  namespace: default
---
# 2. Definizione del Role per gestire i Deployment
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-manager
  namespace: default
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# 3. Binding del Role per il namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployment-manager-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: event-management-sa
  namespace: default
roleRef:
  kind: Role
  name: deployment-manager
  apiGroup: rbac.authorization.k8s.io
---
# 4. ClusterRole per la Discovery dei NODI a livello di Cluster
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-reader
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
---

# 5. Binding del ClusterRole al ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-reader-binding
subjects:
- kind: ServiceAccount
  name: event-management-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: node-reader
  apiGroup: rbac.authorization.k8s.io
---
# 6. Deployment di EventManagement
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-management
  namespace: default
  labels:
    app: event-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-management
  template:
    metadata:
      labels:
        app: event-management
    spec:
      serviceAccountName: event-management-sa 
      nodeSelector:
        tier: cloud
      containers:
      - name: event-management
        image: event-management:latest
        imagePullPolicy: Never 
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgis-svc:5432/event_management"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "postgres"
        - name: MQTT_BROKER_URL
          value: "tcp://mosquitto-svc:1883"
---
# 7. Service NodePort per accesso esterno
apiVersion: v1
kind: Service
metadata:
  name: event-management-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: event-management
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
    nodePort: 30080
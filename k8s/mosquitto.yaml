# -------------------------------------------------------------
# ConfigMap condivisa per consentire connessioni anonime e WebSockets (Mosquitto v2.x)
# -------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: default
data:
  mosquitto.conf: |
    # Listener TCP standard (Simulator e Pod Java)
    listener 1883 0.0.0.0
    protocol mqtt
    allow_anonymous true

    # Listener WebSockets (Frontend React Browser)
    listener 9001 0.0.0.0
    protocol websockets
    allow_anonymous true
---
# =============================================================
# 1. BROKER MQTT - NODO CLOUD
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto-cloud
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mosquitto-cloud
  template:
    metadata:
      labels:
        app: mosquitto-cloud
    spec:
      nodeSelector:
        node-id: node-cloud
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:2.0
        ports:
        - containerPort: 1883
          hostPort: 1883
          protocol: TCP
        - containerPort: 9001
          hostPort: 9001
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /mosquitto/config/mosquitto.conf
          subPath: mosquitto.conf
      volumes:
      - name: config
        configMap:
          name: mosquitto-config
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-cloud
  namespace: default
spec:
  type: NodePort
  selector:
    app: mosquitto-cloud
  ports:
  - port: 1883
    targetPort: 1883
    nodePort: 31883 # Porta esterna accessibile dal Simulatore Python
---
